<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarpEdit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--ink:#182A2E;--paper:#F7FAFA;--card:#fff;--soft:#EAF1F1;--line:#D5DEDE;--muted:#56696C;--teal:#0B6E6E;--mint:#43B3AD;--gate:#B23A2E;--warn:#9A6212;--ok:#1E7A4F;--crit:#D9542F;--on:#fff;
--c-platform:#6B7A7D;--c-api:#0B6E6E;--c-console:#9C7A12;--c-quality:#7A2D2D;--c-install:#1F4E79}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 0 10px}
h1{font-size:20px;margin:0} .stats{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px} .stats b{color:var(--ink)}
nav.tabs{display:flex;gap:6px;margin-top:10px} button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 11px;cursor:pointer}
button[aria-selected="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.pane[hidden]{display:none!important} .tracker{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
@media(max-width:860px){.tracker{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:7px 9px;border-radius:7px;background:var(--soft);margin-bottom:6px;cursor:pointer}
.row .id{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px} .row .id::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--gc);margin-right:6px}
.meta{grid-column:2;color:var(--muted);font-size:11.5px}
.chip{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.chip.crit{color:var(--crit)}.chip.done{color:var(--ok)}.chip.run{color:var(--warn)}.chip.gate{color:var(--gate)}
.tlwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:12px}
.bar{position:absolute;border-radius:5px;color:#fff;font-size:10.5px;padding:3px 5px;overflow:hidden;cursor:pointer;background:var(--gc)}
.bar b{font-family:"IBM Plex Mono",monospace;display:block}
table{border-collapse:collapse;width:100%;font-size:12.5px} th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.gate{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gate);border-radius:10px;padding:12px}
#det{position:fixed;right:16px;top:88px;width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 8px 28px #0002}
.editbar{display:flex;gap:8px;align-items:center;margin-top:8px}
input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.note{color:var(--muted);font-size:12px}
</style></head><body>
<header class="top"><div class="titlerow"><h1>WarpEdit</h1><div class="stats" id="stats"></div></div>
<nav class="tabs" role="tablist">
 <button role="tab" id="tab-tracker" aria-selected="true" data-pane="tracker">Tracker</button>
 <button role="tab" id="tab-timeline" data-pane="timeline">Timeline</button>
 <button role="tab" id="tab-gates" data-pane="gates">Gates</button>
 <button role="tab" id="tab-tickets" data-pane="tickets">Tickets</button>
</nav>
<div class="editbar" id="editbar" hidden>
 <span class="note">Edit mode · dirty <b id="dirty">no</b></span>
 <button id="save" type="button">Save beam</button>
 <button id="undo" type="button">Undo</button>
</div></header>
<main>
<section id="pane-tracker"><div class="tracker"><div class="panel"><h3>Start now</h3><div id="ready"></div></div><div class="panel"><h3>Board</h3><div id="board"></div></div></div></section>
<section id="pane-timeline" hidden><div class="tlwrap"><div id="tl" style="position:relative;height:420px"></div></div></section>
<section id="pane-gates" hidden><div class="gates" id="gates"></div></section>
<section id="pane-tickets" hidden><input id="q" type="search" placeholder="Filter id, summary, lock" style="margin-top:12px"><div class="twrap"><table><thead><tr><th>Id</th><th>Summary</th><th>Size</th><th>Deps</th><th>Locks</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main>
<aside id="det" hidden></aside>
<script id="data" type="application/json">{"mode": "editable \u2014 save downloads a beam", "tickets": [{"id": "WE-01", "size": "S", "hours": 4, "summary": "Audit WarpView read-only contract before editing", "locks": ["docs/audit"], "deps": [], "area": "platform", "ac": ["Audit lists every read-only control", "Day-0 note says WarpView WV-13 is already merged"]}, {"id": "WE-02", "size": "M", "hours": 7, "summary": "Dirty-state model over the loaded beam", "locks": ["apps/viewer/src/edit/dirty"], "deps": ["WE-01"], "area": "api", "ac": ["An edit sets dirty", "Reload prompt appears when dirty"]}, {"id": "WE-03", "size": "L", "hours": 11, "summary": "Save writer for beam.json and schedule.json", "locks": ["apps/viewer/src/edit/save"], "deps": ["WE-02"], "area": "api", "ac": ["Save downloads a beam with the same ticket ids", "Invalid JSON is refused"]}, {"id": "WE-04", "size": "S", "hours": 4, "summary": "Inline edit of ticket summary", "locks": ["apps/viewer/src/edit/summary"], "deps": ["WE-02"], "area": "console", "ac": ["Summary edit shows in the table", "Cancel restores the prior summary"]}, {"id": "WE-05", "size": "L", "hours": 11, "summary": "Dependency editor with cycle refusal", "locks": ["apps/viewer/src/edit/deps"], "deps": ["WE-02"], "area": "console", "ac": ["Adding a dep that cycles is rejected", "A removed dep can make a ticket ready"]}, {"id": "WE-06", "size": "M", "hours": 7, "summary": "Lock-path editor", "locks": ["apps/viewer/src/edit/locks"], "deps": ["WE-02"], "area": "console", "ac": ["A new lock path is stored on the ticket", "Empty lock list is refused"]}, {"id": "WE-07", "size": "S", "hours": 4, "summary": "Size editor S M L XL and auto-merge flag", "locks": ["apps/viewer/src/edit/size"], "deps": ["WE-02"], "area": "console", "ac": ["Changing L to M sets autoMerge true", "Changing M to XL sets autoMerge false"]}, {"id": "WE-08", "size": "M", "hours": 7, "summary": "Undo stack for the last 20 edits", "locks": ["apps/viewer/src/edit/undo"], "deps": ["WE-04", "WE-05"], "area": "platform", "ac": ["Undo restores the previous summary", "Redo reapplies it"]}, {"id": "WE-09", "size": "M", "hours": 7, "summary": "Validate deps, locks, and sizes before save", "locks": ["apps/viewer/src/edit/validate"], "deps": ["WE-03", "WE-05", "WE-06"], "area": "quality", "ac": ["A missing dep blocks save", "The error names the ticket id"]}, {"id": "WE-10", "size": "L", "hours": 11, "summary": "Warn when two ready tickets share a lock", "locks": ["apps/viewer/src/edit/conflicts"], "deps": ["WE-05", "WE-06"], "area": "quality", "ac": ["Overlap is listed before save", "Prefix overlap counts as overlap"]}, {"id": "WE-11", "size": "M", "hours": 7, "summary": "Export WARP_PLAN.json from the edited graph", "locks": ["apps/viewer/src/edit/export"], "deps": ["WE-09"], "area": "api", "ac": ["Export includes estimate and deps", "Markdown brief matches the JSON ids"]}, {"id": "WE-12", "size": "S", "hours": 4, "summary": "Save confirmation and reload of the saved beam", "locks": ["apps/viewer/src/edit/reload"], "deps": ["WE-03"], "area": "console", "ac": ["Confirm names the file", "Reload shows the edited summary"]}, {"id": "WE-13", "size": "XL", "hours": 16, "summary": "Drag a timeline bar to change forecast start", "locks": ["apps/viewer/src/edit/timeline"], "deps": ["WE-08", "WE-10"], "area": "console", "ac": ["Drop updates start label", "A move that violates a dep snaps back"]}, {"id": "WE-14", "size": "L", "hours": 11, "summary": "Round trip: edit, save, reload, compare", "locks": ["apps/viewer/src/edit/roundtrip"], "deps": ["WE-11", "WE-12", "WE-13"], "area": "quality", "ac": ["Saved beam equals the reloaded model", "Human hours estimate updates after a size change"]}], "gates": [{"key": "G0", "name": "WarpView shipped", "blocking": true, "members": ["WE-01"], "checks": ["WarpView WV-13 is merged and the read-only map opens"], "ifRed": "Do not start edit work. The viewer contract is the base."}, {"key": "G1", "name": "Save is safe", "blocking": true, "members": ["WE-03", "WE-09"], "checks": ["Save refuses a cycle", "Downloaded beam reloads"], "ifRed": "Do not ship drag-edit until save validates."}], "estimate": {"agentHours": 111, "humanHours": 3.5, "elapsedHours": 20}}</script>
<script>
const EDIT = true;
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'warpedit';
let st = {merged:[], running:[]};
try { const s = JSON.parse(localStorage.getItem(KEY)||'null'); if (s) st = s; } catch (e) {}
let dirty = false, undo = [];
const saveSt = () => localStorage.setItem(KEY, JSON.stringify(st));
const state = id => st.merged.includes(id) ? 'done' : st.running.includes(id) ? 'run' : 'todo';
const ready = () => D.tickets.filter(t => state(t.id)==='todo' && t.deps.every(d => st.merged.includes(d)));
function row(t){
  const s = state(t.id);
  return `<div class="row" data-id="${t.id}" style="--gc:var(--c-${t.area})"><span class="id">${t.id}</span><span>${t.summary}</span><span class="chip ${s==='done'?'done':s==='run'?'run':'gate'}">${s}</span><span class="meta">${t.size} · ${t.locks[0]} · deps ${t.deps.join(', ')||'—'}</span></div>`;
}
function render(){
  document.getElementById('stats').innerHTML = `<span><b>${D.tickets.length}</b> tickets</span><span><b>${D.estimate.agentHours}</b> agent-hours</span><span><b>${D.estimate.humanHours}</b> human-hours</span><span>elapsed <b>${D.estimate.elapsedHours}h</b></span><span class="note">${D.mode}</span>`;
  document.getElementById('ready').innerHTML = ready().map(row).join('') || '<p class="note">Nothing ready.</p>';
  document.getElementById('board').innerHTML = D.tickets.map(row).join('');
  document.getElementById('gates').innerHTML = D.gates.map(g=>`<article class="gate"><h4>${g.key} · ${g.name}</h4><p class="note">${g.members.join(', ')}</p><ul>${g.checks.map(c=>`<li>${c}</li>`).join('')}</ul><p class="note">${g.ifRed}</p></article>`).join('');
  const q = (document.getElementById('q').value||'').toLowerCase();
  document.getElementById('tb').innerHTML = D.tickets.filter(t=>!q||(t.id+t.summary+t.locks.join(' ')).toLowerCase().includes(q)).map(t=>`<tr data-id="${t.id}"><td class="id">${t.id}</td><td>${t.summary}</td><td>${t.size}</td><td>${t.deps.join(', ')||'—'}</td><td>${t.locks.join(', ')}</td></tr>`).join('');
  const tl = document.getElementById('tl');
  tl.innerHTML = D.tickets.map((t,i)=>`<div class="bar" data-id="${t.id}" style="--gc:var(--c-${t.area});left:${12+ (i%8)*110}px;top:${20+Math.floor(i/8)*70}px;width:100px;height:48px"><b>${t.id}</b>${t.size}</div>`).join('');
  document.getElementById('dirty').textContent = dirty ? 'yes' : 'no';
}
function open(id){
  const t = D.tickets.find(x=>x.id===id); if(!t) return;
  const edit = EDIT ? `<label class="note">Summary</label><input id="sum" value="${t.summary.replace(/"/g,'"')}" style="width:100%">` : '';
  document.getElementById('det').hidden = false;
  document.getElementById('det').innerHTML = `<button id="close" type="button">Close</button><h2>${t.id}</h2><p>${t.summary}</p><p class="note">${t.size} · ${t.hours}h · ${t.locks.join(', ')}</p><p>Blocked by ${t.deps.join(', ')||'none'}</p><ul>${t.ac.map(a=>`<li>${a}</li>`).join('')}</ul>${edit}<div style="margin-top:8px"><button data-act="start" type="button">Mark started</button> <button data-act="merge" type="button">Mark merged</button></div>`;
  document.getElementById('close').onclick = () => document.getElementById('det').hidden = true;
  if (EDIT) document.getElementById('sum').onchange = e => { undo.push(JSON.stringify(t)); t.summary = e.target.value; dirty = true; render(); open(id); };
}
document.body.addEventListener('click', e => {
  const act = e.target.dataset.act, id = e.target.closest('[data-id]')?.dataset.id;
  if (act && id) {
    if (act==='start' && !st.running.includes(id)) st.running.push(id);
    if (act==='merge') { st.merged.push(id); st.running = st.running.filter(x=>x!==id); }
    saveSt(); render(); return;
  }
  if (id) open(id);
});
document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.pane, [role=tab]').forEach(n => { if (n.dataset) {} });
  ['tracker','timeline','gates','tickets'].forEach(k => {
    document.getElementById('pane-'+k).hidden = k!==b.dataset.pane;
    document.getElementById('tab-'+k).setAttribute('aria-selected', k===b.dataset.pane);
  });
});
document.getElementById('q').addEventListener('input', render);
if (EDIT) {
  document.getElementById('editbar').hidden = false;
  document.getElementById('save').onclick = () => {
    const blob = new Blob([JSON.stringify({tickets:D.tickets, gates:D.gates, estimate:D.estimate}, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'beam.edited.json'; a.click();
    dirty = false; render();
  };
  document.getElementById('undo').onclick = () => { const prev = undo.pop(); if (!prev) return; const t = JSON.parse(prev); const i = D.tickets.findIndex(x=>x.id===t.id); if (i>=0) D.tickets[i]=t; dirty=true; render(); };
}
render();
</script></body></html>
